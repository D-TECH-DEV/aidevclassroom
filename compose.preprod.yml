# ==============================================================================
# Environnement PREPROD — Docker Compose (compose.preprod.yml)
# Images optimisées, réseau isolé, healthchecks, limites de ressources
# PAS DE SERVICE POSTGRESQL (PostgreSQL externe du VPS via DATABASE_URL)
# ==============================================================================

name: aidev-preprod

services:
  backend:
    build:
      context: ./aidev_api
      target: prod
    image: aidev-api:preprod
    container_name: aidev-api-preprod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.preprod}
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aidev-preprod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./aidevsprint
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: aidev-frontend:preprod
    container_name: aidev-frontend-preprod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.preprod}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aidev-preprod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.27-alpine
    container_name: aidev-proxy-preprod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - aidev-preprod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz | grep -q 'healthy' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  aidev-preprod-net:
    name: aidev-preprod-network
    driver: bridge
