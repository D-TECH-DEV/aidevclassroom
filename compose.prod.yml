# ==============================================================================
# Environnement PRODUCTION VPS (sans Coolify) — Docker Compose (compose.prod.yml)
# Stack complète et autonome : PostgreSQL + Backend + Frontend + Reverse Proxy Nginx
# ==============================================================================

name: aidev-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: aidev-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aidev_db}
    volumes:
      - aidev-pgdata-prod:/var/lib/postgresql/data
    networks:
      - aidev-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aidev_user} -d $${POSTGRES_DB:-aidev_db}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./aidev_api
      target: prod
    image: aidev-api:${API_VERSION:-latest}
    container_name: aidev-api-prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aidev-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./aidev_front
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PAYSTACK_CHARGE_ENABLED: ${NEXT_PUBLIC_PAYSTACK_CHARGE_ENABLED:-1}
    image: aidev-frontend:${FRONTEND_VERSION:-latest}
    container_name: aidev-frontend-prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aidev-prod-net
    healthcheck:
      # 127.0.0.1 et non localhost : dans l'image Alpine, localhost résout
      # en ::1 en premier et le serveur Next n'écoute qu'en IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27-alpine
    container_name: aidev-proxy-prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Volumes pour le stockage des certificats Let's Encrypt / Certbot sur le VPS
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - aidev-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz | grep -q 'healthy' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aidev-pgdata-prod:
    name: aidev-pgdata-prod
  certbot-etc:
    name: aidev-certbot-etc
  certbot-var:
    name: aidev-certbot-var

networks:
  aidev-prod-net:
    name: aidev-prod-network
    driver: bridge
