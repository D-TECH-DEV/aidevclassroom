# ==============================================================================
# Environnement PRODUCTION — Docker Compose (compose.prod.yml)
# Architecture haute disponibilité, Nginx reverse proxy, limites de ressources
# AUCUN SERVICE POSTGRESQL (PostgreSQL externe administré sur le VPS)
# ==============================================================================

name: aidev-prod

services:
  backend:
    build:
      context: ./aidev_api
      target: prod
    image: aidev-api:${API_VERSION:-latest}
    container_name: aidev-api-prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    expose:
      - "3000"
    extra_hosts:
      # Permet de joindre le PostgreSQL du VPS s'il est exécuté directement sur l'hôte Ubuntu
      - "host.docker.internal:host-gateway"
    networks:
      - aidev-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./aidevsprint
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: aidev-frontend:${FRONTEND_VERSION:-latest}
    container_name: aidev-frontend-prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aidev-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27-alpine
    container_name: aidev-proxy-prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Volume pour le stockage des certificats Let's Encrypt / Certbot sur le VPS
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - aidev-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz | grep -q 'healthy' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Volumes applicatifs pour les certificats SSL Nginx / Certbot (aucun volume de données DB)
  certbot-etc:
    name: aidev-certbot-etc
  certbot-var:
    name: aidev-certbot-var

networks:
  aidev-prod-net:
    name: aidev-prod-network
    driver: bridge
