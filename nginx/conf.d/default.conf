# ==============================================================================
# Routage et Reverse Proxy — Aidev Classroom
# ==============================================================================

# ── Définition des services amonts (Upstreams) ───────────────────────────────
upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server backend:3000;
    keepalive 32;
}

# ── Serveur HTTP Principal (Port 80) ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # En-tetes de securite applicatifs
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.paystack.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.paystack.co https://checkout.paystack.com; frame-src https://checkout.paystack.com https://standard.paystack.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Blocage strict de la documentation Swagger en production
    location ^~ /api/docs {
        return 404;
    }

    # Défi ACME pour la génération / renouvellement de certificats Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Healthcheck Nginx interne
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Webhook Paystack exempté de limit_req pour garantir la réception des paiements
    location = /api/v1/payments/webhook/paystack {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Limitation stricte sur la connexion admin et la récupération OTP
    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/v1/enrollments/recovery/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API NestJS : préfixe réel du backend (API_PREFIX=api/v1).
    # Doit rester AVANT /api/ : Nginx choisit la location préfixe la plus
    # longue, donc /api/v1/health va au backend...
    location /api/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Headers de proxy indispensables
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Support WebSockets / Streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts adaptés
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ...et /api/<racine-publique> va au relais même-origine de Next.js
    # (src/app/api/[...chemin]/route.ts), qui rappelle le backend en
    # serveur-à-serveur. Sans ceci, le relais serait court-circuité par
    # le bloc ci-dessus et les inscriptions/paiements renverraient 404.
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        # Headers de proxy indispensables
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Support WebSockets (Next.js HMR et flux temps réel)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Routage par défaut vers le Frontend Next.js
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        # Headers de proxy indispensables
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Support WebSockets (Next.js HMR et flux temps réel)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

