# ==============================================================================
# Environnement DEV -- Docker Compose (compose.dev.yml)
# PostgreSQL local en conteneur, hot reload backend/frontend, ports exposes
# ==============================================================================

name: aidev-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: aidev-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aidev_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aidev-pgdata-dev:/var/lib/postgresql/data
    networks:
      - aidev-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dev_user} -d $${POSTGRES_DB:-aidev_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./aidev_api
      target: dev
    container_name: aidev-api-dev
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.dev}
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    volumes:
      - ./aidev_api:/app
      - /app/node_modules
    extra_hosts:
      # Permet de joindre un PostgreSQL alternatif sur l'hote si besoin
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aidev-dev-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./aidev_front
      target: dev
    container_name: aidev-frontend-dev
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:3000/api/v1}
      - NEXT_PUBLIC_PAYSTACK_CHARGE_ENABLED=${NEXT_PUBLIC_PAYSTACK_CHARGE_ENABLED:-1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./aidev_front:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aidev-dev-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.27-alpine
    container_name: aidev-proxy-dev
    profiles: ["preprod"]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - aidev-dev-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz | grep -q 'healthy' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aidev-pgdata-dev:
    name: aidev-pgdata-dev

networks:
  aidev-dev-net:
    name: aidev-dev-network
    driver: bridge
