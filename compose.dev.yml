# ==============================================================================
# Environnement DEV — Docker Compose (compose.dev.yml)
# Hot reload, montages de code source, ports exposés localement
# PAS DE SERVICE POSTGRESQL (Base externe configurée via DATABASE_URL)
# ==============================================================================

name: aidev-dev

services:
  backend:
    build:
      context: ./aidev_api
      target: dev
    container_name: aidev-api-dev
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.dev}
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    volumes:
      - ./aidev_api:/app
      - /app/node_modules
    extra_hosts:
      # Permet de joindre un PostgreSQL tournant sur l'hôte Linux/Mac/Windows
      - "host.docker.internal:host-gateway"
    networks:
      - aidev-dev-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./aidevsprint
      target: dev
    container_name: aidev-frontend-dev
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./aidevsprint:/app
      - /app/node_modules
      - /app/.next
    networks:
      - aidev-dev-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  aidev-dev-net:
    name: aidev-dev-network
    driver: bridge
