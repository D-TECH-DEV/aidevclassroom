# ==============================================================================
# CI — Aidev Classroom (verifications frontend + backend)
#
# Declenchement : push et pull_request sur `main`.
# Chaine : verifications frontend + backend (typage strict, audit npm de
# production, tests unitaires backend, compilation des deux apps).
# Le deploiement continu est gere directement par Coolify via compose.coolify.yml.
# ==============================================================================

name: CI Verification (Frontend & Backend)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Verification du frontend Next.js -------------------------------------
  verifier-frontend:
    name: Verifier frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aidev_front
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aidev_front/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Controle de typage strict
        run: npx tsc --noEmit

      - name: Audit securite dependances de production
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Compilation de production
        run: npm run build
        env:
          # Valeur factice : prouve que le build passe sans fuiter de secret.
          # La vraie URL est injectee au build sur le VPS via .env.prod.
          NEXT_PUBLIC_API_URL: http://backend:3000/api/v1

  # -- Verification du backend NestJS ---------------------------------------
  verifier-backend:
    name: Verifier backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aidev_api
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aidev_api/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma (factice, build uniquement)
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public

      - name: Controle de typage strict
        run: npx tsc --noEmit
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public

      - name: Audit securite dependances de production
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Executer les tests unitaires
        run: npm test
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public

      - name: Compilation de production
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
